<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Miner Clicker</title>
<style>
:root{--bg:#121214;--card:#202024;--panel:#29292e;--line:#323238;--text:#e1e1e6;--muted:#a8a8b3;--accent:#fba94c;--green:#04d361;--purple:#8257e5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;margin:0;padding:20px;display:flex;justify-content:center}
#game-container{width:100%;max-width:1250px;background:var(--card);padding:25px;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.6);border:1px solid var(--line)}
header{text-align:center;margin-bottom:20px}
header h1{color:var(--accent);margin:0;font-size:28px}
header p{margin:6px 0 0;color:var(--muted)}
.panel{background:var(--panel);padding:15px;border-radius:12px;border-left:4px solid var(--accent)}
.panel h3{margin:0 0 10px;font-size:16px;color:var(--muted)}
#inventory{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px 16px;margin-bottom:15px}
.stats-row{display:flex;justify-content:space-between;gap:8px;margin:8px 0;font-size:15px}
.highlight{color:var(--accent);font-weight:bold}
#main-layout{display:grid;grid-template-columns:1fr 1.1fr 1.2fr;gap:15px;align-items:start}
#market{max-height:70vh;overflow-y:auto}
.click-section{text-align:center;padding:10px 0 5px}
.btn-kaz{background:linear-gradient(135deg,#fba94c 0%,#e58d32 100%);color:var(--bg);font-size:26px;font-weight:bold;padding:18px 50px;border:none;border-radius:12px;cursor:pointer;transition:all .1s ease;box-shadow:0 4px 12px rgba(251,169,76,.3)}
.btn-kaz:hover{filter:brightness(1.1)}
.btn-kaz:active{transform:scale(.97);box-shadow:0 2px 6px rgba(251,169,76,.2)}
button.action-btn{background-color:var(--green);color:var(--bg);padding:9px 14px;border:none;border-radius:8px;cursor:pointer;font-weight:bold;width:100%;margin-top:8px;font-size:13px;transition:.2s}
button.action-btn:hover:not(:disabled){filter:brightness(.88)}
button.action-btn:disabled{background-color:#4b4b52!important;color:#7c7c8a;cursor:not-allowed}
.trade-group{margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.trade-title{font-size:14px;font-weight:bold}
#redeem-section{margin-top:14px;padding-top:12px;border-top:1px dashed #444}
#redeem-input{width:100%;padding:9px;background:var(--bg);border:1px solid #444;color:#fff;border-radius:8px;text-align:center;font-size:13px}
#story-box{margin-top:10px;font-style:italic;color:#e74c3c;min-height:22px;font-size:13px;text-align:center}
.hidden{display:none!important}
#map-btn{position:fixed;top:15px;left:15px;z-index:10;background:linear-gradient(135deg,#fba94c 0%,#e58d32 100%);color:#121214;font-weight:bold;font-size:14px;padding:10px 16px;border:none;border-radius:10px;cursor:pointer;box-shadow:0 4px 12px rgba(251,169,76,.3)}
#map-btn:hover{filter:brightness(1.1)}
@media(max-width:900px){#main-layout{grid-template-columns:1fr}#market{max-height:none}}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#121214}}
</style>
</head>
<body>
<div id="game-container">
  <header>
    <h1>⛏️ Miner Clicker</h1>
    <p>Katman: <span id="layer-name" class="highlight">Katman 1</span></p>
  </header>

  <div class="panel" style="margin-bottom:15px">
    <h3>🎒 Envanter</h3>
    <div id="inventory"></div>
  </div>

  <div id="main-layout">
    <div class="panel">
      <h3>📊 Kazma İstatistikleri</h3>
      <div class="stats-row"><span>Seviye:</span><span id="tier-name" class="highlight">Mücevher</span></div>
      <div class="stats-row"><span>Toplam Tıklama:</span><span id="total-clicks" class="highlight">0</span></div>
      <div class="stats-row"><span>Harcanan:</span><span class="highlight"><span id="total-spent">0</span> <span class="cur">Müv.</span></span></div>
      <h3 style="margin-top:16px">⚡ Tıklama Başına Üretim</h3>
      <div id="rates"></div>
    </div>

    <div class="panel" style="border-left-color:var(--green)">
      <h3>🛠️ Yükseltmeler</h3>
      <div class="stats-row"><span>Kazma Gücü:</span><span id="power-display" class="highlight">1</span></div>
      <div class="click-section"><button class="btn-kaz" id="mine-btn">KAZ !</button></div>
      <button class="action-btn" id="upgrade-click" style="background:#2980b9">Kazma Gücünü Artır (<span id="upgrade-cost">10</span> <span class="cur">Müv.</span>)</button>
      <div id="redeem-section">
        <div style="font-size:13px;color:var(--muted);margin-bottom:6px">🎟️ Kupon Kodu Kullan</div>
        <input type="text" id="redeem-input" placeholder="Kod yaz...">
        <button class="action-btn" id="redeem-btn" style="background:var(--purple)" onclick="useRedeemCode()">Kullan</button>
      </div>
      <div id="story-box"></div>
    </div>

    <div class="panel" style="border-left-color:var(--purple)">
      <h3>📈 Küresel Borsa</h3>
      <div id="market"></div>
      <button class="action-btn hidden" id="to-layer-2-btn" style="background:var(--purple)" onclick="goToLayer2()">Borsa Katmanı 2'ye Geç!</button>
    </div>
  </div>
</div>

<script>
// Malzemeler: [anahtar, emoji, isim, kısa isim, renk, katman]
const MATS = [
  ['gems','💎','Mücevher','Müv.','#3498db',1],['gold','🪙','Altın','Altın','#d35400',1],
  ['emerald','🟩','Zümrüt','Zümrüt','#27ae60',1],['magma','🔥','Magma','Magma','#c0392b',1],
  ['diamond','💠','Elmas','Elmas','#2980b9',1],['prism','🔮','Prizma','Prizma','#8e44ad',1],
  ['core','🌌','Çekirdek','Çekirdek','#34495e',1],
  ['nuclear','⚛️','Nükleer Küre','N. Küre','#3498db',2],['electric','⚡','Elektrik Küresi','Elektrik K.','#d35400',2],
  ['zeroGravity','🌌','Yerçekimsiz Madde','Yerçekimsiz M.','#27ae60',2],['atom','⚛️','Atom','Atom','#c0392b',2],
  ['whiteMatter','⬜','Beyaz Madde','Beyaz M.','#2980b9',2],['darkMatter','⬛','Karanlık Madde','Karanlık M.','#8e44ad',2]
];
const M = Object.fromEntries(MATS.map(m => [m[0], {emoji:m[1], name:m[2], short:m[3], color:m[4], layer:m[5]}]));
const DIV = [1,10,100,1000,10000,100000,1000000]; // Katman 1 üretim bölenleri

// Borsa: kaynak -> [[hedef, maliyet, kazanç], ...]
const TRADES = {
  gems:[['gold',1e4,1],['emerald',1e5,1],['magma',4e5,1],['diamond',5e5,1],['prism',1e6,1],['core',5e7,1]],
  gold:[['gems',1,1e4],['emerald',10,1],['magma',40,1],['diamond',50,1],['prism',100,1],['core',5000,1]],
  emerald:[['gems',1,1e5],['gold',1,10],['magma',4,1],['diamond',5,1],['prism',10,1],['core',50,1]],
  magma:[['gems',1,4e5],['gold',1,40],['emerald',1,4],['diamond',5,4],['prism',10,4],['core',125,1]],
  diamond:[['gems',1,5e5],['gold',1,50],['emerald',1,5],['magma',4,5],['prism',2,1],['core',100,1]],
  prism:[['gems',1,1e6],['gold',1,100],['emerald',1,10],['magma',2,5],['diamond',1,2],['core',50,1]],
  core:[['gems',1,5e7],['gold',1,5000],['emerald',1,50],['magma',1,125],['diamond',1,100],['prism',1,50]],
  nuclear:[['electric',1e4,1],['zeroGravity',5e4,1],['atom',15e4,1],['whiteMatter',3e5,1],['darkMatter',6e5,1]],
  electric:[['nuclear',1,1e4],['zeroGravity',5,1],['atom',15,1],['whiteMatter',30,1],['darkMatter',60,1]],
  zeroGravity:[['nuclear',1,5e4],['electric',1,5],['atom',3,1],['whiteMatter',6,1],['darkMatter',12,1]],
  atom:[['nuclear',1,15e4],['electric',1,15],['zeroGravity',1,3],['whiteMatter',2,1],['darkMatter',4,1]],
  whiteMatter:[['nuclear',1,3e5],['electric',1,30],['zeroGravity',1,6],['atom',1,2],['darkMatter',2,1]],
  darkMatter:[['nuclear',1,6e5],['electric',1,60],['zeroGravity',1,12],['atom',1,4],['whiteMatter',1,2]]
};

const fmt = n => n.toLocaleString('tr-TR');
const keysOf = layer => MATS.filter(m => m[5] === layer).map(m => m[0]);
const baseOf = layer => layer === 1 ? 'gems' : 'nuclear';

let currentLayer = 1, clickPower = 1, upgradeCost = 10, totalClicks = 0, totalSpent = 0;
let materials = Object.fromEntries(MATS.map(m => [m[0], 0]));
let seen = {gems:true, nuclear:true};
let usedCodes = [];

const $ = id => document.getElementById(id);
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
};

function saveGame(){
  store.set('miner_materials', JSON.stringify(materials));
  store.set('miner_seen', JSON.stringify(seen));
  store.set('miner_usedCodes', JSON.stringify(usedCodes));
  store.set('miner_currentLayer', currentLayer);
  store.set('miner_clickPower', clickPower);
  store.set('miner_upgradeCost', upgradeCost);
  store.set('miner_totalClicks', totalClicks);
  store.set('miner_totalSpent', totalSpent);
}

function loadGame(){
  try {
    const saved = store.get('miner_materials');
    if (!saved) return;
    Object.assign(materials, JSON.parse(saved));
    Object.assign(seen, JSON.parse(store.get('miner_seen') || '{}'));
    usedCodes = JSON.parse(store.get('miner_usedCodes') || '[]');
    currentLayer = parseInt(store.get('miner_currentLayer')) || 1;
    clickPower = parseInt(store.get('miner_clickPower')) || 1;
    upgradeCost = parseInt(store.get('miner_upgradeCost')) || 10;
    totalClicks = parseInt(store.get('miner_totalClicks')) || 0;
    totalSpent = parseInt(store.get('miner_totalSpent')) || 0;
  } catch(e) {}
}

// Envanter, üretim ve borsa arayüzünü aktif katmana göre kur
function buildLayerUI(){
  const keys = keysOf(currentLayer);
  $('inventory').innerHTML = keys.map(k =>
    `<div class="stats-row"><span>${M[k].emoji} ${M[k].name}:</span><span class="highlight" id="inv-${k}">0</span></div>`).join('');
  $('rates').innerHTML = keys.map(k =>
    `<div class="stats-row"><span>${M[k].emoji} ${M[k].name}:</span><span class="highlight" id="rate-${k}">0</span></div>`).join('');
  $('market').innerHTML = keys.map(k =>
    `<div class="trade-group" id="group-${k}">
      <div class="trade-title" style="color:${M[k].color}">${M[k].name} Piyasası</div>
      ${TRADES[k].map(([to,cost,gain]) =>
        `<button class="action-btn" data-from="${k}" data-to="${to}" data-cost="${cost}" data-gain="${gain}" style="background:${M[k].color};color:#fff" onclick="convert('${k}','${to}',${cost},${gain})">${fmt(cost)} ${M[k].short} → ${fmt(gain)} ${M[to].short}</button>`).join('')}
    </div>`).join('');
  $('layer-name').textContent = 'Katman ' + currentLayer;
  $('tier-name').textContent = M[baseOf(currentLayer)].name;
  document.querySelectorAll('.cur').forEach(el => el.textContent = M[baseOf(currentLayer)].short);
}

function updateUI(){
  const keys = keysOf(currentLayer);
  keys.forEach(k => {
    if (materials[k] > 0) seen[k] = true;
    $('inv-' + k).textContent = fmt(materials[k]);
    $('group-' + k).classList.toggle('hidden', !seen[k]);
    const rate = currentLayer === 1 ? Math.floor(clickPower / DIV[keys.indexOf(k)]) : (k === 'nuclear' ? clickPower : 0);
    $('rate-' + k).textContent = fmt(rate);
  });
  document.querySelectorAll('#market button').forEach(b => {
    b.disabled = materials[b.dataset.from] < Number(b.dataset.cost);
  });
  const base = baseOf(currentLayer);
  $('power-display').textContent = fmt(clickPower);
  $('upgrade-cost').textContent = fmt(upgradeCost);
  $('upgrade-click').disabled = materials[base] < upgradeCost;
  $('total-clicks').textContent = fmt(totalClicks);
  $('total-spent').textContent = fmt(totalSpent);
  $('to-layer-2-btn').classList.toggle('hidden', !(currentLayer === 1 && materials.core >= 1));
}

$('mine-btn').addEventListener('click', () => {
  totalClicks++;
  if (currentLayer === 1) {
    keysOf(1).forEach((k, i) => { materials[k] += Math.floor(clickPower / DIV[i]); });
  } else {
    materials.nuclear += clickPower;
  }
  saveGame(); updateUI();
});

$('upgrade-click').addEventListener('click', () => {
  const base = baseOf(currentLayer);
  if (materials[base] >= upgradeCost) {
    materials[base] -= upgradeCost;
    totalSpent += upgradeCost;
    clickPower++;
    upgradeCost = Math.floor(upgradeCost * 1.5);
    saveGame(); updateUI();
  }
});

function convert(from, to, cost, gain){
  if (materials[from] >= cost) {
    materials[from] -= cost;
    materials[to] += gain;
    saveGame(); updateUI();
  }
}

function goToLayer2(){
  currentLayer = 2;
  buildLayerUI(); saveGame(); updateUI();
}

let storyTimer;
function showStory(text){
  $('story-box').textContent = text;
  clearTimeout(storyTimer);
  storyTimer = setTimeout(() => { $('story-box').textContent = ''; }, 3000);
}

function useRedeemCode(){
  const code = $('redeem-input').value.trim();
  if (usedCodes.includes(code)) {
    showStory('Bu kod zaten kullanıldı!');
  } else if (code === 'Toji435') {
    usedCodes.push(code);
    materials.gems += 50000;
    showStory('Kupon kodu başarıyla kullanıldı! +50.000 Mücevher');
    saveGame(); updateUI();
  } else if (code === 'XDIB2') {
    usedCodes.push(code);
    if (currentLayer === 1) goToLayer2();
    showStory('Katman 2 açıldı!');
    saveGame();
  } else {
    showStory('Geçersiz kupon kodu!');
  }
}

loadGame();
buildLayerUI();
updateUI();
</script> <!--
 <button id="map-btn" onclick="location.href='map.html'">🗺️</button> -->
</body>
</html>
